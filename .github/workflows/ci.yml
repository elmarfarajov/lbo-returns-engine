name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.8"
      - run: ruff check src tests app
      - run: ruff format --check src tests app

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"
      - name: Tests
        run: pytest -q --cov=lbolab --cov-report=term-missing
      - name: Accounting and returns validation
        run: lbolab validate
      - name: End-to-end example deals
        run: |
          lbolab demo --example helios --out reports/helios --trials 200 --no-leverage-curve
          lbolab run deals/apex_rollup.yaml --out reports/apex --no-monte-carlo --no-leverage-curve
